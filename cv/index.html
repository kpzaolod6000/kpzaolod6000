<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi CV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e2e;
      color: #cdd6f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background-color: #181825;
      border-bottom: 1px solid #313244;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .btn-descargar {
      background-color: #89b4fa;
      color: #1e1e2e;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-descargar:hover {
      background-color: #b4befe;
    }

    main {
      flex: 1;
      overflow: hidden;
    }

    embed,
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mi Curriculum Vitae</h1>
    <a class="btn-descargar" href="public/files/CV_kpucho_definitive.pdf" download>Descargar PDF</a>
  </header>
  <main>
    <embed src="public/files/CV_kpucho_definitive.pdf" type="application/pdf" />
  </main>
</body>
</html>
